<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Infrasound Microbarometer Dashboard</title>
    <!-- Stlite (Serverless Streamlit WebAssembly) CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.css"
    />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          // List the Python dependencies required by your app
          requirements: [
            "numpy",
            "pandas",
            "scipy",
            "plotly",
            "altair"
          ],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py",
            }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
