<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SIH26144 Microbarometer Infrasound Dashboard</title>
    <!-- Stlite CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css"
    />
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0e1117;
      }
      .loading-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #00f0ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-box">
        <h2>⚡ Loading Infrasound Telemetry Engine...</h2>
        <p style="color: #8e90a6; font-size: 0.9rem;">Initializing Python WebAssembly runtime & database (first load takes a few seconds)...</p>
      </div>
    </div>

    <!-- Stlite ES Module Loader -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js";

      mount(
        {
          entrypoint: "app.py",
          files: {
            // Main Entry Point
            "app.py": { url: "./app.py" },

            // All Core Python Modules
            "core/config.py": { url: "./core/config.py" },
            "core/data_source.py": { url: "./core/data_source.py" },
            "core/database.py": { url: "./core/database.py" },
            "core/dsp.py": { url: "./core/dsp.py" },
            "core/plots.py": { url: "./core/plots.py" },
            "core/runtime.py": { url: "./core/runtime.py" },
            "core/ui.py": { url: "./core/ui.py" },

            // Database
            "data/microbarometer.db": { url: "./data/microbarometer.db" },

            // Pages
            "pages/1_Live_Dashboard.py": { url: "./pages/1_Live_Dashboard.py" },
            "pages/2_Signal_Analysis.py": { url: "./pages/2_Signal_Analysis.py" },
            "pages/3_Events.py": { url: "./pages/3_Events.py" },
            "pages/4_System.py": { url: "./pages/4_System.py" },
            "pages/5_Prototype.py": { url: "./pages/5_Prototype.py" },
            "pages/6_About.py": { url: "./pages/6_About.py" },
            "pages/7_Calibration.py": { url: "./pages/7_Calibration.py" }
          },
          requirements: [
            "numpy",
            "pandas",
            "scipy",
            "plotly",
            "matplotlib",
            "altair"
          ]
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
